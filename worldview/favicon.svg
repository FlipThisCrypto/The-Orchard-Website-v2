<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Orchard">
  <!-- Brand tokens from MISSION.md: near-black green ground, the holographic
       gradient (purple → blue → cyan → green → yellow), $JUICE orange. Kept to
       three shapes so it still reads at 16px. -->
  <defs>
    <linearGradient id="holo" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b14aef"/>
      <stop offset="0.26" stop-color="#4f7bff"/>
      <stop offset="0.5" stop-color="#28d0d0"/>
      <stop offset="0.72" stop-color="#46e08a"/>
      <stop offset="1" stop-color="#f4d23c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#070b09"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="url(#holo)" stroke-width="5"/>
  <circle cx="32" cy="32" r="7" fill="#ff9f2e"/>
</svg>
