name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the checkout.
permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install — the repo is deliberately zero-dependency
      # and uses Node's built-in test runner.
      - name: Unit tests
        run: node --test

      # tasks.json is the source of truth; TASKS.md and dashboard/data.js are
      # generated from it. Fail if someone edited the JSON without regenerating.
      - name: Task board is in sync with tasks.json
        run: node scripts/generate.mjs --check

      - name: Script URLs match their file hashes
        run: node scripts/stamp-assets.mjs --check

      - name: Syntax-check standalone scripts
        run: |
          set -e
          # Note: CI deliberately does NOT check the live deployment. Pages is
          # direct-upload, so production legitimately lags the repo between
          # deploys — failing PRs for that would be noise. Run
          # `node scripts/check-deployed.mjs` when you want that answer.
          for f in scripts/*.mjs worldview/*.js dashboard/*.js; do
            case "$f" in */vendor/*) continue;; esac
            echo "checking $f"
            node --check "$f"
          done
