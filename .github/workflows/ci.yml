name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the checkout.
permissions:
  contents: read

jobs:
  test:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The secrets scan reads every blob ever committed — a credential
          # deleted later is still exposed. The default shallow clone would
          # give it one commit to look at and it would pass while blind.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install — the repo is deliberately zero-dependency
      # and uses Node's built-in test runner.
      #
      # What runs is defined once, in scripts/checks.mjs, and shared with the
      # pre-commit hook. It used to be spelled out here AND in the hook AND in
      # that script, and no two agreed: neither automated gate ran the secrets
      # scan, which is how it stayed broken for four iterations while
      # SECURITY.md cited it. A gate that is described in three places is
      # three gates.
      #
      # Deliberately excluded: --live. Pages is direct-upload, so production
      # legitimately lags the repo between deploys and failing PRs for that
      # would be noise. Run `node scripts/checks.mjs --live` when you want
      # that answer.
      - name: Run the repo's checks
        run: node scripts/checks.mjs
